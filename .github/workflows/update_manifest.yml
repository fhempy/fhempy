
name: Test update manifest

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:    
  call_tests:
    needs: [update_manifest]
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  update_manifest:
    runs-on: ubuntu-24.04

    steps: 
    - name: Checkout Repostory
      uses: actions/checkout@v7
      with:
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        ref: ${{ github.event.pull_request.head.ref }}
        fetch-depth: 0
        
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install toml

    - name: Update dependencies in manifest.json
      run: |
        python3 pyproject2manifest.py

    - name: Commit changes
      # GITHUB_TOKEN is read-only for fork and dependabot PRs, pushing would fail
      if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
      uses: EndBug/add-and-commit@v9
      with:
        default_author: github_actions
        commit: --signoff
        message: "action: auto update manifest.json"
        push: true
