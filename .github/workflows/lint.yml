name: Lint fhempy

on:
  pull_request:
    paths:
      - 'FHEM/bindings/python/**.py'
      - 'pyproject.toml'
      - '.github/workflows/lint.yml'
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.13"
    - name: Check for blocking calls in async functions
      run: |
        python -m pip install ruff==0.16.8
        ruff check --output-format github FHEM/bindings/python/fhempy
