
name: Test fhempy

on:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.12", "3.13", "3.14"]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install apt depencies
      run: |
        sudo apt update
        sudo apt install libffi-dev libssl-dev libjpeg-dev zlib1g-dev autoconf build-essential libglib2.0-dev libdbus-1-dev bluez libbluetooth-dev libcairo2-dev libgirepository1.0-dev libgirepository-2.0-dev pkg-config
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: 2.5.1
    - name: Install dependencies
      run: |
        # locked with hashes, regenerate with:
        # uv pip compile --universal --python-version 3.12 --generate-hashes
        #   .github/requirements/tests.in -o .github/requirements/tests.txt
        python -m pip install --require-hashes --only-binary :all: -r .github/requirements/tests.txt
    - name: Test with tox
      run: |
        tox
