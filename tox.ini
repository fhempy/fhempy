[tox]
isolated_build = true
envlist = py311, py312, py313, py314

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
allowlist_externals = poetry
commands_pre =
    poetry install --with dev --no-root
commands =
    pytest -v FHEM/bindings/python/tests/mocked

[flake8]
max-line-length = 88
max-complexity = 10
