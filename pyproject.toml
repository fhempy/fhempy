[build-system]
requires = [ "poetry-core",]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "fhempy"
description = "Python binding for FHEM to support Python modules"
version = "2.13.6"
authors = [ "Dominik Karall <dominik.karall@gmail.com>",]
readme = "README.md"
homepage = "https://github.com/fhempy/fhempy"
[[tool.poetry.packages]]
include = "fhempy"
from = "FHEM/bindings/python"

[tool.semantic_release]
build_command = "pip install poetry && poetry build"
version_variables = [ "FHEM/bindings/python/fhempy/lib/version.py:__version__",]
version_toml = [ "pyproject.toml:tool.poetry.version",]

[tool.setuptools]
include-package-data = true
script-files = [ "FHEM/bindings/python/bin/fhempy",]

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/fhempy/fhempy/issues"
Sponsorship = "https://github.com/sponsors/fhempy"

[tool.poetry.scripts]
fhempy = "fhempy.lib.fhem_pythonbinding:run"

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
websockets = "==17.3"
importlib_metadata = "7.2.1"
pycryptodomex = "3.24.1"
ifaddr = "==0.2.0"
zeroconf = "==0.151.5"
markdown2 = "2.5.5"
requests = "2.34.2"
async-upnp-client = "0.49.0"
packaging = "26.3"
pexpect = "==4.9.0"
aiofiles = "==25.1.0"
orjson = "3.13.0"

[tool.setuptools.package-data]
"*" = [ "README.md",]

[tool.poetry.dependencies.aiohttp]
extras = [ "speedups",]
version = "3.14.5"

[tool.poetry.group.all]
optional = true

[tool.setuptools.packages.find]
where = [ "FHEM/bindings/python",]
exclude = [ "tests*",]

[tool.poetry.group.all.dependencies]
GitPython = "==3.2.1"
PyGObject = "<=3.50.0"
aioblescan = "==0.2.14"
aiohomekit = "==4.0.1"
aionefit = "==0.14"
alphaessopenapi = "==0.0.21"
async-timeout = "==5.0.1"
async-upnp-client = "==0.49.0"
asyncssh = "==2.24.1"
aiomqtt = "==1.2.1"
beautifulsoup4 = "==4.15.0"
bleak = "==3.0.2"
bleparser = "==3.7.3"
bluepy = "==1.3.0"
bluetooth-adapters = "==2.4.0"
bluetooth-auto-recovery = "==1.6.4"
bt_proximity = "==0.2.1"
btsocket = "==0.3.0"
construct = "==2.10.70"
cryptography = [
    { version = "==50.0.2", markers = "platform_system != 'Darwin' or platform_machine != 'x86_64'" },
    { version = "==48.0.1", markers = "platform_system == 'Darwin' and platform_machine == 'x86_64'" },
]
dbus-python = "==1.5.0"
esphome = "==2026.10.1"
esphome-device-builder = "==1.26.0"
goodwe = "==0.4.10"
greeclimate = "==4.1.0"
httpx = "==0.28.1"
huawei-solar = "==3.0.7"
# hyundai_kia_connect_api 4.41 needs pycryptodome>=4, greeclimate 4.1 still pins <4,
# fhempy installs it with an uv override (pkg_installer.UV_OVERRIDES)
# hyundai_kia_connect_api = "==4.41.2"
janus = "==2.0.0"
luma_led-matrix = "==1.9.0"
lxml = "==6.1.3"
meross-iot = "==0.4.8.0"
miauth = "==0.9.7"
miflora = "==0.7.2"
mitemp-bt = "==0.0.5"
mytoyota = "==2.2.2"
opencv-python-headless = "==5.0.0.93"
# tuya-iot-py-sdk and tuya-device-sharing-sdk use the paho-mqtt 1.x API
paho-mqtt = "==1.6.1"
pexpect = "==4.9.0"
pillow = "==12.3.0"
playwright = "==1.64.0"
pyTibber = "==0.39.1"
# pybluez 0.30 wasn't released yet, we use the github tag
# pybluez = "==0.30"
pychromecast = "==14.1.0"
pygatt = "==5.0.0"
pyit600 = "==0.5.1"
pyjwt = "==2.15.1"
# pymyenergi fails to resolve by poetry
# pymyenergi = "==0.1.1"
pyprusalink = "==3.1.0"
pyqrcode = "==1.2.1"
pyric = "==0.1.6.3"
python-dateutil = "==3.0.0"
python-miio = "==0.5.12"
