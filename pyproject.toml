[tool.poetry.group.dev.dependencies]
tox = "4.67.1"
pytest = "9.1.1"
pytest-env = "1.8.1"
pytest-mock = "3.17.0"
pytest-asyncio = ">=1.4.0,<2.0.0"
requests-mock = "1.12.1"
pyyaml = "==6.0.3"
toml = "^0.10.2"
# module installs in tests use uv like bin/fhempy (pkg_installer.UV_OVERRIDES)
uv = "0.13.5"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# only blocking calls in async functions, they freeze FHEM while running
select = ["ASYNC2"]

[tool.ruff.lint.per-file-ignores]
# known small file operations from before this check, don't add new ones
"FHEM/bindings/python/fhempy/lib/core/bluetoothle.py" = ["ASYNC240"]
"FHEM/bindings/python/fhempy/lib/pkg_installer.py" = ["ASYNC230"]
"FHEM/bindings/python/fhempy/lib/xiaomi_gateway3/core/gateway3.py" = ["ASYNC230", "ASYNC240"]
"FHEM/bindings/python/fhempy/lib/zigbee2mqtt/zigbee2mqtt.py" = ["ASYNC230", "ASYNC240"]
